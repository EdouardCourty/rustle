<text class="l" x="24" y="139">squid</text>
<rect class="o" x="120" y="125" width="388.5" height="20" rx="3"/>
<text class="v" x="516.5" y="140">43,710 msg/s</text>
<text class="l" x="24" y="169">3proxy</text>
<rect class="o" x="120" y="155" width="294.5" height="20" rx="3"/>
