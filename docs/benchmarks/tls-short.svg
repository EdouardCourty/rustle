<svg xmlns="http://www.w3.org/2000/svg" width="760" height="168" viewBox="0 0 760 168" role="img" aria-label="HTTPS proxy, a new connection per request">
<style>
.bg{fill:#fff}.t{fill:#1f2328;font:600 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.s{fill:#656d76;font:12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.l{fill:#1f2328;font:13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.v{fill:#1f2328;font:600 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.o{fill:#8c959f}.r{fill:#e5532d}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.t,.l,.v{fill:#e6edf3}.s{fill:#8b949e}.o{fill:#6e7681}.r{fill:#ff7b54}}
</style>
<rect class="bg" width="760" height="168" rx="8"/>
<text class="t" x="24" y="28">HTTPS proxy, a new connection per request</text>
<text class="s" x="24" y="47">Requests per second with TLS session resumption, higher is better · 1 core · auth on · best of the concurrency sweep · median of 3</text>
<text class="l" x="24" y="79">rustle</text>
<rect class="r" x="120" y="65" width="520.0" height="20" rx="3"/>
<text class="v" x="648.0" y="80">6,119 req/s</text>
<text class="l" x="24" y="109">gost</text>
<rect class="o" x="120" y="95" width="213.8" height="20" rx="3"/>
<text class="v" x="341.8" y="110">2,516 req/s</text>
<text class="l" x="24" y="139">squid</text>
<rect class="o" x="120" y="125" width="174.0" height="20" rx="3"/>
<text class="v" x="302.0" y="140">2,047 req/s</text>
</svg>
