workers 1
http_port 8080
https_port 8443 tls-cert=/etc/squid/cert.pem tls-key=/etc/squid/key.pem
cache deny all
cache_mem 0 MB
access_log none
cache_store_log none
max_filedescriptors 524288
pid_filename /tmp/squid.pid
forwarded_for delete
via off
dns_nameservers 127.0.0.11
shutdown_lifetime 1 seconds
http_access allow all
