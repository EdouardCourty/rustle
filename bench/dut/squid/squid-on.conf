workers 1
http_port 8080
https_port 8443 tls-cert=/etc/squid/cert.pem tls-key=/etc/squid/key.pem
cache deny all
# 1 MB socket buffers, like rustle's server.socket_buffer_bytes default (+12 % at 1 MB,
# neutral at 1 KB: FAIRNESS.md).
tcp_recv_bufsize 1 MB
read_ahead_gap 1 MB
cache_mem 0 MB
access_log none
cache_store_log none
max_filedescriptors 524288
pid_filename /tmp/squid.pid
forwarded_for delete
via off
dns_nameservers 127.0.0.11
shutdown_lifetime 1 seconds
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/htpasswd
auth_param basic children 20 startup=5 idle=2
auth_param basic credentialsttl 2 hours
acl authed proxy_auth REQUIRED
# WebSocket upgrades on the plain-HTTP path (Squid >= 5.5; off by default). Only
# fast ACLs apply here (proxy_auth is not one): authentication is still enforced
# by http_access below.
http_upgrade_request_protocols WebSocket allow all
http_access allow authed
http_access deny all
