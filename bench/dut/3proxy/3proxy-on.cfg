nserver 127.0.0.11
nscache 65536
timeouts 1 5 30 60 180 1800 15 60
auth strong
users "bench:CL:secret1"
allow *
maxconn 200000
# TCP_NODELAY on both legs: the documented tuning for small exchanges. Without it
# 3proxy sits in Nagle + delayed-ACK (~40 ms per keep-alive request: 1.5k vs 5.5k req/s
# at 1 KB on the same box). See FAIRNESS.md.
proxy -p8080 -osTCP_NODELAY -ocTCP_NODELAY
