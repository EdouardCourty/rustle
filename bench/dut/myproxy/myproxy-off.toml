[server]
listen = "0.0.0.0:8080"
workers = 1

[auth]
api_keys = []

[limits]
max_connections = 200000
max_header_bytes = 65536

[timeouts]
connect = "5s"
idle = "120s"

[dns]
ttl = "60s"
max_entries = 4096

[http]
upstream_keepalive = true
max_idle_per_origin = 32

# auth section omitted on purpose: no keys -> auth disabled
