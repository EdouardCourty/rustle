[server]
listen = "0.0.0.0:8080"
workers = 1
socket_buffer_bytes = 1048576

[auth]
api_keys = ["secret1"]

[limits]
max_connections = 200000
max_header_bytes = 65536

[timeouts]
connect = "5s"
idle = "120s"

[dns]
ttl = "60s"
max_entries = 4096

[http]
upstream_keepalive = true
max_idle_per_origin = 1024
# Body budget (bytes) test: 1 KB upstream objects pass, 1 MB is rejected.
max_request_body_bytes = 0
max_response_body_bytes = 0

[tls]
listen = "0.0.0.0:8443"
cert = "/etc/rustle/cert.pem"
key = "/etc/rustle/key.pem"
ktls = false

[filter]
# Bench: upstream/sink live on the private Docker network.
block_private = false

[log]
# Bench: off; ACCESS_LOG=errors|all (run-bench.sh) measures its cost.
access = "off"
file = "/tmp/access.log"
