name: proxybench

# CPU pinning: PROXY_CPU gives the proxy under test its own core,
# BENCH_CPU hosts generator/upstream/sink. Defaults 0/1; run-bench.sh
# auto-detects from the cgroup cpuset (e.g. "0,2" or "1,3").
services:
  upstream:
    build: ./upstream
    cpuset: "${BENCH_CPU:-1}"

  sink:
    # Rust discard server (no fork per connection, unlike socat).
    build: ./generator
    entrypoint: ["bench-client"]
    command: ["sink", "0.0.0.0:9000"]
    cpuset: "${BENCH_CPU:-1}"
    sysctls:
      - net.core.somaxconn=65535
    ulimits:
      nofile: { soft: 524288, hard: 524288 }

  proxy:
    image: ${PROXY_IMAGE:-myproxy:bench}
    environment:
      AUTH: ${AUTH:-on}
    cpuset: "${PROXY_CPU:-0}"
    sysctls:
      - net.core.somaxconn=65535
      # The proxy is the active closer of proxy->sink tunnels: without
      # tw_reuse + a wide port range, TIME_WAIT sockets exhaust ephemeral
      # ports across back-to-back hold runs (EADDRNOTAVAIL -> 502).
      - net.ipv4.ip_local_port_range=1024 65535
      - net.ipv4.tcp_tw_reuse=1
    ulimits:
      nofile: { soft: 524288, hard: 524288 }

  generator:
    build: ./generator
    entrypoint: ["bench-client"]
    profiles: ["generator"]
    cpuset: "${BENCH_CPU:-1}"
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65535
      - net.ipv4.tcp_tw_reuse=1
    ulimits:
      nofile: { soft: 524288, hard: 524288 }
