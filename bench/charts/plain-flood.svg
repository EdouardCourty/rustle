</style>
<rect class="bg" width="760" height="228" rx="8"/>
<text class="t" x="24" y="28">CONNECT tunnels, bulk transfer</text>
<text class="s" x="24" y="47">Gbit/s through 8 tunnels, higher is better · 1 core · auth on · best of the concurrency sweep · median of 3</text>
