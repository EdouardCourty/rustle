<text class="l" x="24" y="109">3proxy</text>
<rect class="o" x="120" y="95" width="370.1" height="20" rx="3"/>
<text class="v" x="498.1" y="110">15.7 Gbit/s</text>
<text class="l" x="24" y="139">squid</text>
<rect class="o" x="120" y="125" width="320.3" height="20" rx="3"/>
<text class="v" x="448.3" y="140">13.6 Gbit/s</text>
<text class="l" x="24" y="169">gost</text>
<rect class="o" x="120" y="155" width="312.2" height="20" rx="3"/>
<text class="v" x="440.2" y="170">13.2 Gbit/s</text>
<text class="l" x="24" y="199">tinyproxy</text>
<rect class="o" x="120" y="185" width="41.7" height="20" rx="3"/>
