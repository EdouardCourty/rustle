[package]
name = "rustle"
version = "0.1.0"
edition = "2021"
description = "Ultra-minimal, high-performance HTTP forward proxy"
license = "MIT"
repository = "https://github.com/EdouardCourty/rustle"
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
base64 = "0.22"
bytes = "1"
h2 = "0.4"
http = "1"
httparse = "1.9"
humantime = "2"
libc = "0.2"
ring = { version = "0.17", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
socket2 = { version = "0.5", features = ["all"] }
subtle = "2"
tokio = { version = "1", features = ["net", "io-util", "rt", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Alternative global allocators (features, mutually exclusive). glibc
# malloc is the default and retains freed pages aggressively - a workload
# with per-connection alloc/free churn (our benchmark) keeps pages in RSS
# after close. jemalloc/mimalloc return them sooner.
jemallocator = { version = "0.5", optional = true }
mimalloc = { version = "0.1", optional = true }

# Kernel TLS offload: Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
ktls = { version = "6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[features]
jemalloc = ["dep:jemallocator"]
mimalloc = ["dep:mimalloc"]
