name: Release

# Push a tag `vX.Y.Z` (matching rustle/Cargo.toml) to publish a release.
# workflow_dispatch = dry run: builds and tests everything, publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: parse-changelog
      - name: The version has a changelog section
        run: parse-changelog CHANGELOG.md "${GITHUB_REF_NAME#v}" > /dev/null
        if: startsWith(github.ref, 'refs/tags/v')

  build:
    needs: changelog
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux: glibc, built on Ubuntu 22.04 (glibc 2.35 = the floor
          # install.sh enforces). Native runners, no cross compilation.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' rustle/Cargo.toml | head -n1)"
          [ "v${crate}" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} != rustle/Cargo.toml version v${crate}" >&2
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked -p rustle

      - name: Build
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo build --locked --release -p rustle

      - name: e2e against the release binary
        run: cargo run --locked -q --profile e2e -p e2e -- --quick

      - name: Package
        shell: bash
        run: |
          set -eu
          [ "$(target/release/rustle --version)" = "rustle $(sed -n 's/^version = "\(.*\)"/\1/p' rustle/Cargo.toml | head -n1) (${{ matrix.target }})" ]
          mkdir -p dist/pkg
          cp target/release/rustle rustle/config.toml.example README.md LICENSE dist/pkg/
          tar -czf "dist/rustle-${{ matrix.target }}.tar.gz" -C dist/pkg rustle config.toml.example README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: rustle-${{ matrix.target }}
          path: dist/rustle-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rustle-*
          merge-multiple: true

      - name: Checksums and version file
        working-directory: dist
        run: |
          sha256sum rustle-*.tar.gz > SHA256SUMS
          echo "${GITHUB_REF_NAME#v}" > VERSION
          cat SHA256SUMS

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/rustle-*.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tagged version's section, without its heading and the link definitions below it.
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## \[/ { p = (index($0, "## [" v "]") == 1); next }
            /^\[[^]]*\]: / { p = 0 }
            p
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no changelog section for ${GITHUB_REF_NAME}" >&2; exit 1; }
          gh release create "${GITHUB_REF_NAME}" dist/rustle-*.tar.gz dist/SHA256SUMS dist/VERSION \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file notes.md

  smoke:
    name: install from the release (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - name: The public one-liner
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/install.sh" | RUSTLE_VERSION="${GITHUB_REF_NAME}" sh
          export PATH="$HOME/.local/bin:$PATH"
          [ "$(rustle --version | cut -d' ' -f2)" = "${GITHUB_REF_NAME#v}" ]
          rustle update --check
