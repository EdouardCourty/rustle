name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: parse-changelog
      - name: Format, and a section for the current version
        run: |
          parse-changelog CHANGELOG.md > /dev/null
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' rustle/Cargo.toml | head -n1)"
          parse-changelog CHANGELOG.md "${crate}" > /dev/null

  lint:
    name: fmt + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: tests + e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: reference platform (splice, kTLS, SO_REUSEPORT shards).
          - { os: ubuntu-latest, e2e: full }
          - { os: ubuntu-24.04-arm, e2e: full }
          # macOS: portable fallback (no splice/kTLS), quick e2e subset.
          - { os: macos-latest, e2e: quick }
          - { os: macos-15-intel, e2e: quick }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Load the kTLS kernel module (Linux)
        if: runner.os == 'Linux'
        run: sudo modprobe tls || echo "kTLS module unavailable, kTLS scenarios skip"
      - name: Unit + in-process end-to-end tests
        run: cargo test -p rustle
      - name: Build the proxy (release)
        run: cargo build --release -p rustle
      - name: e2e (${{ matrix.e2e }})
        shell: bash
        run: |
          flag=""
          [ "${{ matrix.e2e }}" = quick ] && flag="--quick"
          cargo run -q --profile e2e -p e2e -- $flag

  installer:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh && shellcheck .github/scripts/test-installer.sh
      - name: Build and package a local release
        shell: bash
        run: |
          set -eu
          cargo build --locked --release -p rustle
          target="$(target/release/rustle --version | sed 's/.*(\(.*\))/\1/')"
          mkdir -p rel pkg
          cp target/release/rustle pkg/
          tar -czf "rel/rustle-${target}.tar.gz" -C pkg rustle
          (cd rel && { sha256sum "rustle-${target}.tar.gz" 2>/dev/null || shasum -a 256 "rustle-${target}.tar.gz"; } > SHA256SUMS)
      - name: Install in distro containers (glibc floor, musl refusal, tampering)
        if: runner.os == 'Linux'
        run: .github/scripts/test-installer.sh rel
      - name: Install on macOS
        if: runner.os == 'macOS'
        run: |
          RUSTLE_BASE_URL="file://$PWD/rel" RUSTLE_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/rustle" --version
