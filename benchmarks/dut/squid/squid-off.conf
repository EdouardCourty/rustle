workers 1
http_port 8080
https_port 8443 tls-cert=/etc/squid/cert.pem tls-key=/etc/squid/key.pem
cache deny all
# 1 MB socket buffers, like rustle's server.socket_buffer_bytes default (+12 % at 1 MB,
# neutral at 1 KB: FAIRNESS.md).
tcp_recv_bufsize 1 MB
read_ahead_gap 1 MB
cache_mem 0 MB
access_log none
cache_store_log none
max_filedescriptors 524288
pid_filename /tmp/squid.pid
forwarded_for delete
via off
dns_nameservers 127.0.0.11
shutdown_lifetime 1 seconds
# WebSocket upgrades on the plain-HTTP path (Squid >= 5.5; off by default).
http_upgrade_request_protocols WebSocket allow all
# Protocol names are case sensitive and clients offer `Upgrade: websocket`.
http_upgrade_request_protocols websocket allow all
http_access allow all
