worker_processes 4;

events {
    worker_connections 65535;
}

http {
    access_log off;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 300s;
    keepalive_requests 1000000;

    server {
        listen 8000;
        server_name upstream;
        root /usr/share/nginx/html;
    }
}
